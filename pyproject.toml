[project]
name = "irs-ai-risk-server"
version = "0.2.0"
description = "IRS AI Risk Scoring MCP Server — GSA hackathon prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx2>=2.0.0",
]

[project.scripts]
irs-risk-server = "irs_risk.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irs_risk"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", ".bob", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
